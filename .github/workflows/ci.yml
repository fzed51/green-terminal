name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Active Corepack (Yarn 4)
        run: corepack enable

      - name: Installe les dépendances
        run: yarn install --immutable

      - name: Lint / format (Biome)
        run: yarn check
